services:
  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: hms-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-hms_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-HMS}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hms-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Express API) ────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hms-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USERNAME:-hms_admin}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-HMS}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      APP_PROTOCOL: ${APP_PROTOCOL:-http}
      APP_HOST: ${APP_HOST:-localhost}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_FREQUENCY: ${BACKUP_FREQUENCY:-daily}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
    volumes:
      - server_uploads:/app/uploads
      - server_backups:/app/backup
    networks:
      - hms-net

  # ── Frontend (React via nginx) ───────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_APP_API: /api
    container_name: hms-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - hms-net

volumes:
  mongo_data:
  server_uploads:
  server_backups:

networks:
  hms-net:
    driver: bridge
